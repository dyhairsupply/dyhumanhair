<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DY Deyu | Human Hair Factory</title>
  <meta name="theme-color" content="#241912">
  <script>
    /* Same location-independent bootstrap as index.html. */
    (function () {
      if (location.protocol === 'file:') {
        document.write('<script src="content/offline-data.js"><\/script>');
        return;
      }
      var p = location.pathname || '/';
      var m = p.match(/^(.*?)\/(?:products|product|factory|about|contact|admin|index\.html|404\.html)(?:\/.*)?$/i);
      var root = m ? m[1] + '/' : p.replace(/[^/]*$/, '');
      if (!root) root = '/';
      window.__DY_ROOT__ = root;
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main id="app" aria-live="polite"><div class="loading-wrap">Loading&hellip;</div></main>
  <div id="site-footer"></div>
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="lightbox-close" type="button" aria-label="Close preview" data-lightbox-close></button>
    <img id="lightbox-img" src="" alt="">
  </div>
  <script defer src="js/app.js"></script>
  <script>
    setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || app.innerHTML.indexOf('loading-wrap') < 0) return;
      app.innerHTML = '<section style="padding:64px 24px;text-align:center;font-family:sans-serif;color:#241912">' +
        '<h2 style="font-size:24px;margin:0 0 16px">页面资源没有加载成功</h2>' +
        '<p style="line-height:1.9">请确认 <b>css/</b>、<b>js/</b>、<b>content/</b>、<b>images/</b> 与 index.html 在同一层发布目录里，' +
        'Build command 留空后重新部署。</p>' +
        '<button onclick="location.reload()" style="padding:10px 24px;background:#241912;color:#fff;border:0;cursor:pointer">重新加载 / Retry</button></section>';
    }, 6000);
  </script>
</body>
</html>
