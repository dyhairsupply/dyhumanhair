<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DY Deyu | Human Hair Wig & Extension Factory in Shandong, China</title>
  <meta name="description" content="Shandong Deyu Hair Products Factory manufactures 100% human hair wigs, lace closures, lace frontals, extensions, wefts and ponytails for distributors, salons and hair brands worldwide.">
  <meta name="theme-color" content="#241912">
  <script>
    /* Location-independent bootstrap.
       - file:// (double-click): no fetch() allowed -> load the offline snapshot.
       - http(s): work out the site root from the URL, so the SAME source works at
         https://site.netlify.app/  AND  https://user.github.io/repo/  (subpath).
         All assets are then written as relative paths resolved against <base>. */
    (function () {
      if (location.protocol === 'file:') {
        document.write('<script src="content/offline-data.js"><\/script>');
        return;
      }
      var p = location.pathname || '/';
      var m = p.match(/^(.*?)\/(?:products|product|factory|about|contact|admin|index\.html|404\.html)(?:\/.*)?$/i);
      var root = m ? m[1] + '/' : p.replace(/[^/]*$/, '');
      if (!root) root = '/';
      window.__DY_ROOT__ = root;
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Netlify Identity invite / recovery links land on the homepage first. */
    (function () {
      var h = window.location.hash || "";
      if (/invite_token|confirmation_token|recovery_token|email_change_token/.test(h)) {
        window.location.replace((window.__DY_ROOT__ || '/').replace(/\/$/, '') + "/admin/" + h);
      }
    })();
  </script>
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main id="app" aria-live="polite">
    <div class="loading-wrap">Loading&hellip;</div>
  </main>

  <div id="site-footer"></div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="lightbox-close" type="button" aria-label="Close preview" data-lightbox-close></button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <noscript>
    <div style="padding:60px 24px;text-align:center;font-family:sans-serif">
      This product showcase requires JavaScript to load its bilingual content.
      Please enable JavaScript in your browser.
    </div>
  </noscript>

  <script defer src="js/app.js"></script>
  <script>
    /* Failsafe with diagnostics: never leave a visitor staring at "Loading...".
       If something is missing (usually a wrong Publish directory), say exactly
       WHICH file is missing instead of a generic error. */
    (function () {
      var CHECKS = [
        ['js/app.js', '站点脚本 / app script'],
        ['css/style.css', '样式表 / stylesheet'],
        ['content/site.json', '实时内容数据 / live JSON'],
        ['content/offline-data.js', '离线快照 / offline snapshot']
      ];
      function probe(url) {
        return new Promise(function (resolve) {
          if (location.protocol === 'file:') {
            var s = document.createElement('script');
            var done = false;
            function finish(ok) {
              if (done) return;
              done = true;
              if (s.parentNode) s.parentNode.removeChild(s);
              resolve(ok);
            }
            s.src = url; s.async = true;
            s.onload = function () { finish(true); };
            s.onerror = function () { finish(false); };
            (document.head || document.body).appendChild(s);
            setTimeout(function () { finish(false); }, 1500);
          } else {
            fetch(url, { cache: 'no-store' }).then(function (r) {
              var ct = (r.headers && r.headers.get) ? (r.headers.get('content-type') || '') : '';
              resolve(r.ok && ct.toLowerCase().indexOf('text/html') < 0);
            }).catch(function () { resolve(false); });
          }
        });
      }
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || app.innerHTML.indexOf('loading-wrap') < 0) return;
        Promise.all(CHECKS.map(function (c) { return probe(c[0]); })).then(function (res) {
          if (app.innerHTML.indexOf('loading-wrap') < 0) return;  /* finished while probing */
          var missing = [];
          var rows = CHECKS.map(function (c, i) {
            if (!res[i]) missing.push(c[0]);
            return '<li style="margin:6px 0">' + (res[i] ? '✅' : '❌') +
              ' <code>' + c[0] + '</code> <span style="color:#857768">— ' + c[1] + '</span></li>';
          }).join('');
          var advice;
          if (missing.indexOf('js/app.js') >= 0 || missing.indexOf('css/style.css') >= 0) {
            advice = '<b>最可能原因：发布目录（Publish directory）不对，或只上传了 index.html。</b><br>' +
              '请把<b>包含 index.html 的那一整层文件夹</b>（里面有 css / js / content / images 四个目录）全部上传或设为发布目录，' +
              'Build command 保持<b>留空</b>，重新部署后再刷新（Ctrl+F5）。';
          } else if (missing.indexOf('content/site.json') >= 0) {
            advice = '<b>内容数据读不到。</b>请确认 <code>content/</code> 目录已提交到仓库，且主机没有把 JSON 请求回退成首页 HTML。' +
              '若用 Netlify：Build settings → Publish directory 填 <code>.</code>，Build command 留空。';
          } else {
            advice = '文件都在，但脚本没有完成初始化。请按 <b>F12</b> 打开控制台查看红色报错，' +
              '或换 Chrome / Edge 浏览器、清除缓存后重试。';
          }
          var baseEl = document.querySelector('base');
          var base = baseEl ? baseEl.href : location.href;
          app.innerHTML = '<section style="padding:64px 24px;text-align:left;font-family:sans-serif;color:#241912;max-width:820px;margin:0 auto">' +
            '<h2 style="font-size:24px;margin:0 0 12px;text-align:center">页面资源没有加载成功</h2>' +
            '<p style="text-align:center;color:#6b5a48;margin:0 0 24px">Resource check — 下面列出哪一项没读到：</p>' +
            '<ul style="list-style:none;padding:0;background:#faf7f2;border:1px solid #e8dfd2;padding:18px 22px;border-radius:4px">' + rows + '</ul>' +
            '<div style="margin:20px 0;line-height:1.9">' + advice + '</div>' +
            '<p style="font-size:12px;color:#857768;line-height:1.8">当前地址 / URL: <code>' + location.href + '</code><br>' +
            '资源根 / base: <code>' + base + '</code><br>' +
            '本地预览：双击 <b>启动本地预览.bat</b>，或运行 <code>python tools/serve.py</code> 后访问 http://localhost:8000/ 。</p>' +
            '<div style="text-align:center;margin-top:24px"><button onclick="location.reload()" ' +
            'style="padding:10px 24px;background:#241912;color:#fff;border:0;cursor:pointer">重新加载 / Retry</button></div>' +
            '</section>';
        });
      }, 6000);
    })();
  </script>
</body>
</html>
